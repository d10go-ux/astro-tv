<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASTRO TV — Wait Screen Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; font-family: 'Inter', sans-serif; overflow: hidden; }
    #overlay-root {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .fade-in { animation: fadeIn 0.6s ease forwards; }
  </style>
</head>
<body>
  <div id="overlay-root"></div>
  <script>
    const root = document.getElementById('overlay-root');
    let currentData = null;

    function updateOverlay(data) {
      if (!data) return;
      currentData = data;

      const { teamA, teamB, sport, match, type, template, customText } = data;
      const sportEmoji = sport === 'volei' ? '🏐' : sport === 'basquete' ? '🏀' : '⚽';

      let title = '', subtitle = '';
      if (type === 'soon') {
        title = 'EM BREVE';
        subtitle = `${teamA.name || 'Time A'} × ${teamB.name || 'Time B'}`;
      } else if (type === 'interval') {
        title = 'INTERVALO';
        subtitle = customText || 'Voltamos em instantes';
      } else {
        title = 'FIM DE JOGO';
        subtitle = `${teamA.name || 'Time A'} × ${teamB.name || 'Time B'}`;
      }

      const dots = type !== 'end' ? `<div style="margin-top:24px;display:flex;gap:10px;">${[0,1,2].map(i => `<div style="width:8px;height:8px;border-radius:50%;background:white;opacity:${0.2 + i*0.2};animation:pulse 1.5s ease-in-out ${i*0.3}s infinite;"></div>`).join('')}</div>` : '';

      if (template === 'minimal') {
        root.innerHTML = `
          <div class="fade-in" style="width:100%;height:100%;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,${teamA.color},transparent 40%,transparent 60%,${teamB.color});"></div>
            <div style="font-family:'Outfit',sans-serif;font-weight:300;font-size:14px;color:rgba(255,255,255,0.3);letter-spacing:8px;text-transform:uppercase;margin-bottom:12px;">${match?.tournament || 'ASTRO TV'}</div>
            <div style="font-family:'Outfit',sans-serif;font-weight:900;font-size:64px;color:white;text-transform:uppercase;letter-spacing:6px;">${title}</div>
            <div style="font-size:18px;color:rgba(255,255,255,0.4);margin-top:8px;">${subtitle}</div>
            ${dots}
          </div>`;
      } else if (template === 'cosmic') {
        root.innerHTML = `
          <div class="fade-in" style="width:100%;height:100%;background:linear-gradient(135deg,#0a001a,#0d0d2b,#001a1a);display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <div style="position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,rgba(124,92,252,0.12),transparent 50%),radial-gradient(circle at 70% 60%,rgba(0,229,208,0.08),transparent 50%);"></div>
            <div style="font-family:'Orbitron',sans-serif;font-weight:700;font-size:12px;color:#00e5d0;letter-spacing:6px;margin-bottom:16px;position:relative;">📡 ${match?.tournament || 'ASTRO TV'}</div>
            <div style="font-family:'Outfit',sans-serif;font-weight:900;font-size:72px;background:linear-gradient(135deg,#7c5cfc,#00e5d0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-transform:uppercase;letter-spacing:4px;position:relative;">${title}</div>
            <div style="font-size:20px;color:rgba(255,255,255,0.5);margin-top:12px;position:relative;">${subtitle}</div>
            ${customText ? `<div style="margin-top:16px;font-size:14px;color:rgba(255,255,255,0.35);position:relative;">${customText}</div>` : ''}
            ${dots}
          </div>`;
      } else {
        root.innerHTML = `
          <div class="fade-in" style="width:100%;height:100%;background:linear-gradient(135deg,${teamA.color}cc,#0a0a1a 40%,#0a0a1a 60%,${teamB.color}cc);display:flex;flex-direction:column;align-items:center;justify-content:center;">
            <div style="position:absolute;inset:0;background:radial-gradient(circle at center,rgba(0,0,0,0.3),transparent 70%);"></div>
            <div style="font-family:'Outfit',sans-serif;font-weight:400;font-size:14px;color:rgba(255,255,255,0.4);letter-spacing:6px;text-transform:uppercase;margin-bottom:16px;position:relative;">${sportEmoji} ${match?.tournament || 'CAMPEONATO'}</div>
            <div style="font-family:'Outfit',sans-serif;font-weight:900;font-size:72px;color:white;text-transform:uppercase;letter-spacing:6px;text-shadow:0 4px 40px rgba(0,0,0,0.5);position:relative;">${title}</div>
            <div style="font-size:20px;color:rgba(255,255,255,0.6);margin-top:8px;position:relative;">${subtitle}</div>
            ${type === 'soon' && match?.time ? `<div style="font-family:'Orbitron',sans-serif;font-weight:700;font-size:28px;color:white;margin-top:20px;position:relative;">⏰ ${match.time}</div>` : ''}
            ${customText ? `<div style="margin-top:16px;font-size:14px;color:rgba(255,255,255,0.4);position:relative;">${customText}</div>` : ''}
            ${dots}
          </div>`;
      }
    }

    // BroadcastChannel sync
    try {
      const channel = new BroadcastChannel('astrotv_waitscreen');
      channel.onmessage = (e) => updateOverlay(e.data);
    } catch (e) {}

    // localStorage fallback
    setInterval(() => {
      try {
        const data = JSON.parse(localStorage.getItem('astrotv_waitscreen_data'));
        if (data && (!currentData || data.timestamp !== currentData.timestamp)) {
          updateOverlay(data);
        }
      } catch (e) {}
    }, 500);

    // Initial load with default fallback
    const defaultData = {
      type: 'soon',
      template: 'gradient',
      sport: 'futsal',
      teamA: { name: 'Time A', color: '#7c5cfc' },
      teamB: { name: 'Time B', color: '#00e5d0' },
      match: { tournament: 'COPA INTERESCOLAR 2026', time: '19:00' }
    };

    try {
      const initial = JSON.parse(localStorage.getItem('astrotv_waitscreen_data'));
      updateOverlay(initial || defaultData);
    } catch (e) {
      updateOverlay(defaultData);
    }
  </script>
</body>
</html>
